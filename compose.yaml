services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: form
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: form
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U form -d form"]
      interval: 5s
      timeout: 5s
      retries: 10
  web:
    build: .
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://form:${POSTGRES_PASSWORD}@db:5432/form
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Set HTTPS public origin in .env}
      TRUST_PROXY: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
